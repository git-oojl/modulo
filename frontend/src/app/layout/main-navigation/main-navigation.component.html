<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar__brand">
    <span>MODULO</span>
  </div>

  <!-- Links de Navegación -->
  <nav class="sidebar__nav" aria-label="Navegación principal">
    @for (item of menuItems; track item.path) {
      <a 
        [routerLink]="item.path" 
        routerLinkActive="sidebar__link--active" 
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        class="sidebar__link"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Footer: Logout y Perfil -->
  <div class="sidebar__footer">
    <button class="sidebar__logout" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>

    <div class="sidebar__profile">
      <!-- Placeholder para la foto de perfil (puedes usar una imagen real luego) -->
      <div class="sidebar__avatar">
        <img src="https://i.pravatar.cc/150?img=47" alt="Avatar" />
      </div>
      <div class="sidebar__user-info">
        <strong>Ana Barajas</strong>
        <span>Mirar perfil</span>
      </div>
      <mat-icon class="sidebar__more-icon">more_vert</mat-icon>
    </div>
  </div>
</aside>
