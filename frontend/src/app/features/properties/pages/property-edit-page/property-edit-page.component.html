<section class="placeholder"><h1>Editar propiedad</h1>@if (form) { <form (ngSubmit)="save()"><label>Título<input name="title" [(ngModel)]="form.title" /></label><label>Precio<input name="price" type="number" [(ngModel)]="form.price" /></label><label>Estado<select name="status" [(ngModel)]="form.status"><option value="borrador">Borrador</option><option value="activa">Activa</option><option value="reservada">Reservada</option><option value="archivada">Archivada</option></select></label><label>Ciudad<input name="city" [(ngModel)]="form.city" /></label><label>Dirección<input name="address" [(ngModel)]="form.address" /></label><label><input name="public" type="checkbox" [(ngModel)]="form.is_public" /> Público</label><button type="submit">Guardar cambios</button><a [routerLink]="['/app/propiedades', id]">Cancelar</a></form> } @else { <p>{{ error() || 'Cargando…' }}</p> }</section>
