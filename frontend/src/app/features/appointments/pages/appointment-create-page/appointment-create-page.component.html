<section class="page" aria-labelledby="create-appointment-title">
  <header class="page__header">
    <div>
      <h1 id="create-appointment-title">Programar nueva cita</h1>
    </div>
    <div style="display: flex; gap: 0.75rem;">
      <button class="btn-secondary" (click)="cancelar()">Cancelar</button>
      <button class="btn-primary" (click)="guardarCita()">
        <mat-icon>save</mat-icon>
        Guardar Cita
      </button>
    </div>
  </header>

  <article class="card" style="padding: 1.5rem; background: #fff; border-radius: 12px;">
    @if (error()) { <p role="alert">{{ error() }}</p> }
    <form class="form-grid">
      <div class="form-group">
        <label for="contacto">Contacto *</label>
        <select id="contacto" class="form-control" name="contact" [(ngModel)]="form.contact">
          <option value="" disabled>Seleccione un contacto...</option>
          @for (contact of contacts(); track contact.id) { <option [value]="contact.id">{{ contact.name }}</option> }
        </select>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha y hora *</label>
        <input type="datetime-local" id="fecha" class="form-control" name="startsAt" [(ngModel)]="form.starts_at" />
      </div>
      <div class="form-group"><label for="property">Propiedad</label><select id="property" class="form-control" name="property" [(ngModel)]="form.property"><option value="">Sin propiedad</option>@for (property of properties(); track property.id) { <option [value]="property.id">{{ property.title }}</option> }</select></div>
      <div class="form-group"><label for="purpose">Propósito</label><select id="purpose" class="form-control" name="purpose" [(ngModel)]="form.purpose"><option value="visita">Visita</option><option value="captacion">Captación</option><option value="cierre">Cierre</option><option value="otro">Otro</option></select></div>
      <div class="form-group"><label for="notes">Notas</label><textarea id="notes" name="notes" [(ngModel)]="form.notes"></textarea></div>
    </form>
  </article>
</section>
