<section class="page" aria-labelledby="appointments-title">
  <header class="page__header">
    <div><h1 id="appointments-title">Citas</h1></div>
    <button class="btn-primary" type="button" (click)="abrirModalNuevo()"><mat-icon>add</mat-icon>Nueva Cita</button>
  </header>

  <div class="filters-card">
    <div class="filters-grid">
      <div class="filter-group"><label for="search-input">Búsqueda</label><div class="search-input-wrapper"><mat-icon>search</mat-icon><input id="search-input" type="search" [(ngModel)]="busqueda" placeholder="Contacto, propiedad o asesor..." /></div></div>
      <div class="filter-group"><label for="filter-estado">Estatus</label><select id="filter-estado" class="filter-select" [(ngModel)]="selectedStatus"><option value="todos">Todos</option><option value="programada">Programada</option><option value="confirmada">Confirmada</option><option value="completada">Completada</option><option value="cancelada">Cancelada</option><option value="no_asistio">No asistió</option></select></div>
      <div class="filter-group"><label for="filter-proposito">Propósito</label><select id="filter-proposito" class="filter-select" [(ngModel)]="selectedPurpose"><option value="todos">Todos</option><option value="visita">Visita</option><option value="captacion">Captación</option><option value="cierre">Cierre</option><option value="otro">Otro</option></select></div>
      <div class="filter-group"><label for="filter-agente">Agente</label><select id="filter-agente" class="filter-select" [(ngModel)]="selectedAgent"><option value="todos">Todos</option>@for (cita of citas; track cita.advisorId) { <option [value]="cita.advisorId">{{ cita.agente }}</option> }</select></div>
    </div>
    <div class="filters-actions"><button class="btn-clear" type="button" (click)="limpiarFiltros()">Limpiar</button></div>
  </div>

  <article class="card table-card"><div class="table-responsive"><table class="data-table"><thead><tr><th>ID</th><th>FECHA / HORA</th><th>CONTACTO</th><th>PROPÓSITO</th><th>ESTATUS</th><th>AGENTE</th><th class="text-center">ACCIÓN</th></tr></thead><tbody>
    @for (cita of filteredCitas; track cita.id) { <tr><td class="text-muted">{{ cita.id }}</td><td><strong>{{ cita.fechaDisplay }}</strong></td><td>{{ cita.contacto }}</td><td>{{ cita.proposito }}</td><td><span class="badge" [ngClass]="getCitaStatusClass(cita.status)">{{ cita.status }}</span></td><td>{{ cita.agente }}</td><td class="actions text-center"><button class="icon-btn" type="button" (click)="abrirModalEditar(cita)" title="Editar" aria-label="Editar cita"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l4.3-.9L19 8.4a2.1 2.1 0 0 0-3-3L5.3 16.1 4 20Z" /></svg></button><button class="icon-btn text-danger" type="button" (click)="eliminarCita(cita.id)" title="Cancelar" aria-label="Cancelar cita"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6" /></svg></button></td></tr> } @empty { <tr><td colspan="7" class="empty-state">No se encontraron citas.</td></tr> }
  </tbody></table></div><div class="pagination"><span class="pagination-info">{{ filteredCitas.length }} cita(s)</span></div></article>
</section>
