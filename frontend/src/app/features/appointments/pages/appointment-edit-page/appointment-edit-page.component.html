<section class="placeholder"><h1>Editar cita</h1>@if (form) { <form (ngSubmit)="save()"><label>Fecha y hora<input name="startsAt" type="datetime-local" [(ngModel)]="form.starts_at" /></label><label>Propósito<select name="purpose" [(ngModel)]="form.purpose"><option value="visita">Visita</option><option value="captacion">Captación</option><option value="cierre">Cierre</option><option value="otro">Otro</option></select></label><label>Estado<select name="status" [(ngModel)]="form.status"><option value="programada">Programada</option><option value="confirmada">Confirmada</option><option value="cancelada">Cancelada</option><option value="no_asistio">No asistió</option></select></label><label>Notas<textarea name="notes" [(ngModel)]="form.notes"></textarea></label><button type="submit">Guardar cambios</button><a [routerLink]="['/app/citas', id]">Cancelar</a></form> } @else { <p>{{ error() || 'Cargando…' }}</p> }</section>
