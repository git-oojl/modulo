@if (contact(); as contact) {
  <section class="contact-edit" aria-labelledby="contact-edit-title">
    <div class="contact-edit__content">
      <nav class="contact-edit__breadcrumb" aria-label="Migas de pan">
        <a routerLink="/app/contactos">Contactos</a>
        <span aria-hidden="true">/</span>
        <a [routerLink]="['/app/contactos', contact.id]"
          >{{ contact.name }}</a
        >
        <span aria-hidden="true">/</span>
        <span>Editar</span>
      </nav>

      <header class="contact-edit__header">
        <h1 id="contact-edit-title">Editar contacto</h1>
        <p>{{ contact.id }} · {{ contact.phone }}</p>
      </header>

      <form class="contact-edit__form" (ngSubmit)="saveChanges()">
        <section class="contact-edit__card" aria-labelledby="edit-personal-title">
          <h2 id="edit-personal-title">Datos personales</h2>
          <div class="contact-edit__fields">
            <label class="contact-edit__field">
              <span>Nombre</span>
              <input name="name" [(ngModel)]="form.name" />
            </label>
            <label class="contact-edit__field">
              <span>Teléfono</span>
              <input name="phone" type="tel" [(ngModel)]="form.phone" />
            </label>
            <label class="contact-edit__field">
              <span>Correo electrónico</span>
              <input name="email" type="email" [(ngModel)]="form.email" />
            </label>
            <label class="contact-edit__field">
              <span>Fuente</span>
              <select name="source" [(ngModel)]="form.source">
                <option [ngValue]="null">Sin fuente</option>
                @for (source of sources(); track source.id) {
                  <option [value]="source.id">{{ source.name }}</option>
                }
              </select>
            </label>
          </div>
        </section>

        <section class="contact-edit__card" aria-labelledby="edit-interest-title">
          <h2 id="edit-interest-title">Notas de la relación</h2>
          <div class="contact-edit__fields">
            <label class="contact-edit__field">
              <span>Notas</span>
              <textarea name="notes" [(ngModel)]="form.notes"></textarea>
            </label>
          </div>
        </section>

        <section class="contact-edit__card" aria-labelledby="edit-assignment-title">
          <h2 id="edit-assignment-title">Asignación y estado</h2>
          <div class="contact-edit__fields contact-edit__fields--compact">
            <label class="contact-edit__field">
              <span>Agente responsable</span>
              <select name="agent" [(ngModel)]="form.advisor_id">
                <option [ngValue]="null">Sin asignar</option>
                @for (agent of agents(); track agent.id) {
                  <option [value]="agent.id">{{ agent.display_name }}</option>
                }
              </select>
            </label>
            <label class="contact-edit__field">
              <span>Estatus</span>
              <select name="status" [(ngModel)]="form.status">
                <option value="prospecto">Prospecto</option>
                <option value="cliente_activo">Cliente activo</option>
                <option value="cliente_cerrado">Cliente cerrado</option>
                <option value="perdido">Perdido</option>
                <option value="inactivo">Inactivo</option>
              </select>
            </label>
          </div>
        </section>

        <footer class="contact-edit__footer">
          <a
            class="contact-edit__button contact-edit__button--secondary"
            [routerLink]="['/app/contactos', contact.id]"
          >
            Cancelar
          </a>
          <button class="contact-edit__button" type="submit">Guardar cambios</button>
        </footer>
      </form>
    </div>
  </section>
} @else {
  <section class="contact-edit" aria-labelledby="contact-edit-title">
    <div class="contact-edit__content">
      <h1 id="contact-edit-title">{{ error() || 'Cargando contacto…' }}</h1>
      <a routerLink="/app/contactos">Volver a Contactos</a>
    </div>
  </section>
}
