<section class="placeholder"><h1>Nuevo contacto</h1><p>Alta de contacto. La asignación y origen se pueden ajustar después según tus permisos.</p>@if (error()) { <p role="alert">{{ error() }}</p> }<form (ngSubmit)="save()"><label>Nombre<input name="name" required [(ngModel)]="form.name" /></label><label>Teléfono<input name="phone" required [(ngModel)]="form.phone" /></label><label>Correo<input name="email" type="email" [(ngModel)]="form.email" /></label><label>Estado<select name="status" [(ngModel)]="form.status"><option value="prospecto">Prospecto</option><option value="cliente_activo">Cliente activo</option><option value="perdido">Perdido</option></select></label><label>Notas<textarea name="notes" [(ngModel)]="form.notes"></textarea></label><button type="submit">Guardar contacto</button><a routerLink="/app/contactos">Cancelar</a></form></section>
