<section class="placeholder"><h1>Editar cierre</h1>@if (form) { <form (ngSubmit)="save()"><label>Fecha<input name="date" type="date" [(ngModel)]="form.closed_on" /></label><label>Monto<input name="amount" type="number" [(ngModel)]="form.amount" /></label><label>Moneda<input name="currency" [(ngModel)]="form.currency" /></label><label>Comisión %<input name="percentage" type="number" [(ngModel)]="form.commission_percentage" /></label><label>Estado comisión<select name="commissionStatus" [(ngModel)]="form.commission.status"><option value="pendiente">Pendiente</option><option value="reportada_pagada">Reportada/pagada</option></select></label><label>Notas<textarea name="notes" [(ngModel)]="form.notes"></textarea></label><button type="submit">Guardar cambios</button><a [routerLink]="['/app/cierres', id]">Cancelar</a></form> } @else { <p>{{ error() || 'Cargando…' }}</p> }</section>
