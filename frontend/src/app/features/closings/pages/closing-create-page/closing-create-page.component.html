<section class="placeholder"><h1>Registrar cierre</h1><p>Registra una venta o renta concretada y calcula su comisión estimada.</p>@if (error()) { <p role="alert">{{ error() }}</p> }<form (ngSubmit)="save()"><label>Propiedad<select name="property" required [(ngModel)]="form.property"><option value="">Selecciona una propiedad</option>@for (property of properties(); track property.id) { <option [value]="property.id">{{ property.title }} · {{ property.city }}</option> }</select></label><label>Contacto<select name="contact" required [(ngModel)]="form.contact"><option value="">Selecciona un contacto</option>@for (contact of contacts(); track contact.id) { <option [value]="contact.id">{{ contact.name }}</option> }</select></label><label>Operación<select name="operation" [(ngModel)]="form.operation"><option value="venta">Venta</option><option value="renta">Renta</option></select></label><label>Fecha<input name="date" required type="date" [(ngModel)]="form.closed_on" /></label><label>Monto<input name="amount" required type="number" min="0" [(ngModel)]="form.amount" /></label><label>Moneda<input name="currency" maxlength="3" [(ngModel)]="form.currency" /></label><label>Comisión estimada %<input name="percentage" type="number" min="0" max="100" [(ngModel)]="form.percentage" /></label><button type="submit">Registrar cierre</button><a routerLink="/app/cierres">Cancelar</a></form></section>
