@if (isOpen()) {
  <aside class="dev-switcher" aria-label="Herramientas de desarrollo">
    <header class="dev-switcher__header">
      <div>
        <strong><span class="dev-switcher__dot"></span>Dev switcher</strong>
        <span>Previsualiza vistas</span>
      </div>
      <button type="button" aria-label="Cerrar herramientas" (click)="isOpen.set(false)">×</button>
    </header>

    <label class="dev-switcher__field">
      <span>Vista</span>
      <select [ngModel]="selectedViewId()" (ngModelChange)="selectView($event)">
        @for (view of views; track view.id) {
          <option [value]="view.id">{{ view.group }} — {{ view.label }}</option>
        }
      </select>
    </label>

    <label class="dev-switcher__field">
      <span>Ver como</span>
      <select [ngModel]="selectedViewer()" (ngModelChange)="selectRole($event)">
        @for (role of roles; track role.value) {
          <option [value]="role.value">{{ role.label }}</option>
        }
      </select>
    </label>

    <p class="dev-switcher__access" [class.dev-switcher__access--blocked]="!viewIsAllowed()">
      {{ accessMessage() }}
    </p>

    <section
      class="dev-switcher__health"
      [class]="'dev-switcher__health dev-switcher__health--' + backend.health().state"
    >
      <div class="dev-switcher__health-header">
        <p class="dev-switcher__health-label">Servicios</p>
        <button type="button" (click)="backend.refresh()">Actualizar</button>
      </div>
      <div>
        <div class="dev-switcher__service-lines">
          <p>
            <span class="dev-switcher__service-name">
              <i
                class="dev-switcher__service-dot"
                [class.dev-switcher__service-dot--ok]="
                  backend.health().state === 'online' || backend.health().state === 'degraded'
                "
                aria-hidden="true"
              ></i>
              Backend
            </span>
            <strong>{{ backend.health().api }}</strong>
          </p>
          <p>
            <span class="dev-switcher__service-name">
              <i
                class="dev-switcher__service-dot"
                [class.dev-switcher__service-dot--ok]="backend.health().state === 'online'"
                aria-hidden="true"
              ></i>
              PostgreSQL
            </span>
            <strong>{{ backend.health().database }}</strong>
          </p>
        </div>
      </div>
    </section>

    <section class="dev-switcher__file">
      <span>Archivo de la vista</span>
      <code>{{ selectedView().filePath }}</code>
      <small>Ruta: {{ selectedView().path }}</small>
    </section>
  </aside>
} @else {
  <button class="dev-switcher__toggle" type="button" (click)="isOpen.set(true)">
    <span class="dev-switcher__dot"></span> DEV
  </button>
}
