# Servicios auxiliares de desarrollo. Django y Angular se ejecutan en el host.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: modulo
      POSTGRES_USER: modulo
      POSTGRES_PASSWORD: modulo_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulo -d modulo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
